basePath: /api/v1
consumes:
- application/json
definitions:
  account_handler.changePasswordReq:
    properties:
      current_password:
        example: qwerty123
        type: string
      new_password:
        example: 321ytrewq
        type: string
    type: object
  account_handler.signInReq:
    properties:
      password:
        example: qwerty123
        type: string
      username:
        example: john_doe
        type: string
    type: object
  application.AuthOutput:
    properties:
      access_token:
        type: string
      customer:
        $ref: '#/definitions/customer.Customer'
    type: object
  customer.Customer:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  helper.ResponseError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  helper.StatusResponse:
    properties:
      status:
        type: string
    type: object
  menu.Category:
    properties:
      ID:
        type: string
      dishes:
        items:
          $ref: '#/definitions/menu.Dish'
        type: array
      position:
        type: integer
      project_id:
        type: string
      translations:
        additionalProperties:
          type: string
        description: key is lang_code
        type: object
    type: object
  menu.Dish:
    properties:
      ID:
        type: string
      category_id:
        type: string
      is_available:
        type: boolean
      options:
        items:
          $ref: '#/definitions/menu.OptionGroup'
        type: array
      photo_mini_url:
        type: string
      photo_url:
        type: string
      position:
        type: integer
      price:
        type: integer
      translations:
        additionalProperties:
          $ref: '#/definitions/menu.DishTranslation'
        description: key is lang_code
        type: object
    type: object
  menu.DishTranslation:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  menu.OptionGroup:
    properties:
      ID:
        type: string
      dish_id:
        type: string
      items:
        items:
          $ref: '#/definitions/menu.OptionItem'
        type: array
      max_quantity:
        type: integer
      min_quantity:
        type: integer
      position:
        type: integer
      translations:
        additionalProperties:
          type: string
        type: object
    type: object
  menu.OptionItem:
    properties:
      ID:
        type: string
      max_quantity:
        type: integer
      min_quantity:
        type: integer
      option_group_id:
        type: string
      position:
        type: integer
      price_modifier:
        type: integer
      translations:
        additionalProperties:
          type: string
        type: object
    type: object
  menu.addCategoryReq:
    properties:
      position:
        example: 1
        type: integer
      translations:
        additionalProperties:
          type: string
        example:
          '{en': Category Name}
        type: object
    type: object
  project.Project:
    properties:
      ID:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      name:
        type: string
      removed_at:
        type: string
      slug:
        type: string
    type: object
  project_handler.addProjectReq:
    properties:
      customer_id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
info:
  contact: {}
  description: no description
  title: Dapso API Documentation
  version: "1.0"
paths:
  /account:
    get:
      consumes:
      - application/json
      description: Get authenticated customer information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.AuthOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ResponseError'
      summary: Get current account
      tags:
      - Account
  /account/login:
    post:
      consumes:
      - application/json
      description: Authenticate customer with username and password
      parameters:
      - description: Sign in credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account_handler.signInReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.AuthOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ResponseError'
      summary: Sign in to Account
      tags:
      - Account
  /account/password:
    patch:
      consumes:
      - application/json
      description: Change password for authenticated customer
      parameters:
      - description: Password change data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account_handler.changePasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ResponseError'
      security:
      - BearerAuth: []
      summary: Change customer password
      tags:
      - Account
  /project:
    post:
      consumes:
      - application/json
      description: Add a new project for a customer
      parameters:
      - description: Project data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/project_handler.addProjectReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.Project'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ResponseError'
      security:
      - BearerAuth: []
      summary: Add new project
      tags:
      - projects
  /project/{ID}:
    delete:
      consumes:
      - application/json
      description: Delete project by ID
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helper.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ResponseError'
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - projects
  /project/{projectID}:
    get:
      consumes:
      - application/json
      description: Get all menu categories for a specific project
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: projectID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/menu.Category'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ResponseError'
      summary: Get Menu Categories
      tags:
      - Menu
  /project/{projectID}/category:
    post:
      consumes:
      - application/json
      description: Add a new category to project menu
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: projectID
        required: true
        type: string
      - description: Category data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/menu.addCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ResponseError'
      summary: Add Menu Category
      tags:
      - Menu
  /project/{slug}:
    get:
      consumes:
      - application/json
      description: Get project information by slug
      parameters:
      - description: Project slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.Project'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helper.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ResponseError'
      summary: Get project by slug
      tags:
      - projects
produces:
- application/json
swagger: "2.0"
